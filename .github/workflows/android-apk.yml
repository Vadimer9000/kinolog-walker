name: Build KinologWalker APK

on:
  push:
    branches: [ "main", "master", "kinolog-walker" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KinologWalker-APK
          path: ${{ steps.locate_apk.outputs.apk_path }}

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
            CAPTION="🐕 *Готова сборка KinologWalker!*%0A%0A💬 _${COMMIT_MSG}_%0A⏰ $(date +'%d.%m.%Y %H:%M:%S UTC')"
            curl -s -F chat_id="${TELEGRAM_CHAT_ID}" \
                 -F "document=@${{ steps.locate_apk.outputs.apk_path }};type=application/vnd.android.package-archive" \
                 -F caption="${CAPTION}" \
                 -F parse_mode="Markdown" \
                 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
          fi
